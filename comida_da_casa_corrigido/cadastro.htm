<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Comida da Casa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login">

    <main class="caixa-login">
        <h1>Criar Conta</h1>
        <p>Preencha os dados abaixo para se cadastrar.</p>

        <!-- Formulário de Cadastro -->
        <form action="cadastro_logic.php" method="POST">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

            <button type="submit" class="btn-entrar">Cadastrar</button>
        </form>

        <div style="margin-top: 20px; text-align: center; font-family: Arial, sans-serif;">
            <p>Já tem uma conta? <a href="index.htm" style="color: orange;">Faça login aqui</a></p>
        </div>
    </main>

</body>
</html>
