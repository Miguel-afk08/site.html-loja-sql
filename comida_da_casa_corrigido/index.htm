<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Comida da Casa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login">

    <main class="caixa-login">
        <h1>Comida da Casa</h1>
        <p>Entre com sua conta para acessar o cardápio.</p>

        <!-- Formulário de Login -->
        <form id="formLogin" action="logic.php" method="POST">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <button type="submit" class="btn-entrar">Entrar</button>
        </form>

        <!-- Espaço para quem não tem conta -->
        <div class="link-cadastro" style="margin-top: 20px; text-align: center; font-family: Arial, sans-serif;">
            <p>Não tem uma conta?</p>
            <a href="cadastro.htm" class="btn-criar-conta">Criar nova conta</a>
        </div>
    </main>

</body>
</html>
