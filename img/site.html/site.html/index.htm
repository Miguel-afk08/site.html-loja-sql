<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Comida da Casa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login">

    <main class="caixa-login">

        <h1> Comida da Casa</h1>

        <p>Entre com sua conta para acessar o cardápio.</p>

        <form id="formLogin">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                minlength="6"
                required
            >

       <button type="submit" class="btn-entrar">Entrar</button>

<a href="cadastro.htm" class="btn-cadastro">Criar Conta</a>

    </main>

    <script>
        const formulario = document.getElementById("formLogin");

        formulario.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value.trim();

            if (email === "" || senha === "") {
                alert("Preencha todos os campos.");
                return;
            }

            alert("Login realizado com sucesso!");

            window.location.href = "cardapio.htm";
        });
    </script>

</body>

</html>
